<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#10303A" />
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="#F2C14E" stroke-width="8" opacity="0.3" />
  <!-- Truck Icon -->
  <g fill="#F2C14E" transform="translate(64, 96) scale(0.75)">
    <!-- Cabin -->
    <path d="M380 180 L460 260 L460 380 L380 380 Z" />
    <rect x="60" y="100" width="300" height="280" rx="20" />
    <!-- Window -->
    <path d="M390 200 L440 250 L390 250 Z" fill="#10303A" />
    <!-- Wheels -->
    <circle cx="140" cy="400" r="45" fill="#EEF1EC" stroke="#10303A" stroke-width="16" />
    <circle cx="380" cy="400" r="45" fill="#EEF1EC" stroke="#10303A" stroke-width="16" />
    <!-- Route Arrow / Wave -->
    <path d="M100 240 Q 210 160, 320 240" fill="none" stroke="#10303A" stroke-width="24" stroke-linecap="round" />
    <circle cx="100" cy="240" r="14" fill="#10303A" />
    <circle cx="320" cy="240" r="14" fill="#10303A" />
  </g>
</svg>
